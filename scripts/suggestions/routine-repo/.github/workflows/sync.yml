# The routine's copy of the Field Guide suggestions tool: see README.md.
# Every 10 minutes it takes the files of the commit kuschonink.com runs (the tool,
# with that repository's own downloader, and this repository's own files, from
# scripts/suggestions/routine-repo/ there), locks sharp's version for `npm ci`,
# and commits them when they changed. It pushes with this repository's deploy
# key (the secret SYNC_DEPLOY_KEY): the ruleset lets nothing else update a branch.
name: Sync
on:
  schedule:
    # Every 10 minutes, off the busy minute :00. GitHub runs a schedule for the
    # account that last changed this line, so the sync's commits are credited to
    # the owner (below): commits by an account without access to the copy left
    # it never running.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Take the files of the commit the site runs
        run: |
          curl -fsS https://raw.githubusercontent.com/itom123/kuschonink.com/main/scripts/suggestions/download.mjs -o "$RUNNER_TEMP/download.mjs"
          node "$RUNNER_TEMP/download.mjs" "$RUNNER_TEMP/tree" > "$RUNNER_TEMP/took.json"
          commit=$(node -p 'require(process.argv[1]).commit' "$RUNNER_TEMP/took.json")
          for f in README.md .gitignore .claude/settings.json .github/workflows/sync.yml; do
            mkdir -p "$RUNNER_TEMP/tree/$(dirname "$f")"
            curl -fsS "https://raw.githubusercontent.com/itom123/kuschonink.com/$commit/scripts/suggestions/routine-repo/$f" -o "$RUNNER_TEMP/tree/$f"
          done
          # sharp at exact versions, so that the routine's `npm ci` installs what was locked here.
          (cd "$RUNNER_TEMP/tree" && npm install --package-lock-only --no-audit --no-fund)
          # Changes once a month, so that the copy never goes 60 days without a
          # commit (GitHub then turns scheduled workflows off).
          date -u +%Y-%m > "$RUNNER_TEMP/tree/.synced"
          node -e 'const t = require(process.argv[1]); console.log(`${t.commit} (${t.why}): ${t.files.length} files`)' "$RUNNER_TEMP/took.json"
      - name: Commit them when they changed
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/tree/." .
          git add -A
          if git diff --cached --quiet; then echo 'No change.'; exit 0; fi
          # Credited to the owner, itom123 (their GitHub no-reply address), with the owner's consent:
          # these commits are the ones that change the cron line above.
          git -c user.name='itom123' -c user.email='13485518+itom123@users.noreply.github.com' \
            commit -q -m "Files from kuschonink.com $(node -p 'require(process.argv[1]).commit' "$RUNNER_TEMP/took.json")"
          git push
